---
# Host nginx for justea.ru is not installed from here: on the shared VPS it belongs to VideoHub's ansible
# (atlas: apps/videohub/infra/ansible/templates/justea-nginx.conf.j2). A second default_server breaks every nginx reload.
- name: Первичная настройка VPS для Justea + host nginx
  hosts: vps
  vars:
    app_dir: /opt/justea-web
    videohub_dir: /opt/videohub

  tasks:
    - name: Install nginx and certbot
      apt:
        name:
          - nginx
          - certbot
          - python3-certbot-nginx
        state: present
        update_cache: yes

    - name: Ensure application directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Remove default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: reload nginx

    - name: Ensure nginx is running
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Restart nginx to reclaim port 80 from docker
      service:
        name: nginx
        state: restarted

    - name: Configure SSL certificates
      import_tasks: tasks/ssl.yml

  handlers:
    - name: reload nginx
      service:
        name: nginx
        state: reloaded

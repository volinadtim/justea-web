---
# Генерация файла паролей dev-стенда. Пароль приходит переменной
# dev_basic_auth_password и нигде не логируется.

- name: Проверить, что пароль basic auth передан
  assert:
    that:
      - dev_basic_auth_password is defined
      - dev_basic_auth_password | length > 0
    fail_msg: >-
      Не задан пароль basic auth для dev-стенда. Передай его так:
      -e dev_basic_auth_password="$JUSTEA_DEV_PASSWORD"
      или файлом: -e @infra/ansible/dev-stand.secrets.yml

- name: Посчитать apr1-хеш пароля
  command: openssl passwd -apr1 -stdin
  args:
    stdin: "{{ dev_basic_auth_password }}"
  register: dev_htpasswd_hash
  changed_when: false
  no_log: true

- name: Записать файл паролей dev-стенда
  copy:
    dest: "{{ dev_htpasswd_path }}"
    content: "{{ dev_basic_auth_user }}:{{ dev_htpasswd_hash.stdout }}\n"
    owner: root
    group: www-data
    mode: "0640"
  no_log: true

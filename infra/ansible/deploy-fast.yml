---
# Host nginx for justea.ru is not installed from here: on the shared VPS it belongs to VideoHub's ansible
# (atlas: apps/videohub/infra/ansible/templates/justea-nginx.conf.j2). A second default_server breaks every nginx reload.
- name: Fast Deploy Justea
  hosts: vps
  vars:
    app_dir: /opt/justea-web
    site_url: https://justea.ru

  tasks:
    - name: Ensure application directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Sync repository from CI workspace
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../../"
        dest: "{{ app_dir }}/"
        delete: yes
        recursive: yes
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=.github"
          - "--exclude=node_modules"
          - "--exclude=.next"

    - name: Create env file
      copy:
        dest: "{{ app_dir }}/.env"
        content: |
          NEXT_PUBLIC_SITE_URL={{ site_url }}
        mode: "0600"

    - name: Build and start containers
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}/infra/docker"
        project_name: justea-web
        build: always
        state: present
      environment:
        DOCKER_BUILDKIT: "1"
        NEXT_PUBLIC_SITE_URL: "{{ site_url }}"

    - name: Remove default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: reload nginx

    - name: Ensure nginx is running
      service:
        name: nginx
        state: started
        enabled: yes

  handlers:
    - name: reload nginx
      service:
        name: nginx
        state: reloaded

# dev.justea.ru — dev-стенд Justea (SSL). Отдельный vhost, прод не трогает.
# Ставится в /etc/nginx/sites-available/host-justea-dev.conf отдельным файлом,
# прод живёт в host-proxy.conf. Апстрим — 127.0.0.1:3002 (прод занимает 3001).
#
# Стенд закрыт двумя независимыми способами:
#   1. X-Robots-Tag на уровне server — попадает в любой ответ, включая 401 и
#      страницы Next.js со своей метой;
#   2. HTTP Basic auth, файл паролей /etc/nginx/.htpasswd-justea-dev.

server {
    listen 80;
    server_name dev.justea.ru;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name dev.justea.ru;

    ssl_certificate /etc/letsencrypt/live/dev.justea.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.justea.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    auth_basic "Justea dev stand";
    auth_basic_user_file /etc/nginx/.htpasswd-justea-dev;

    # robots.txt отдаёт nginx и без пароля: краулер должен прочитать запрет,
    # а не получить 401. Без add_header в этом location, чтобы наследовался
    # X-Robots-Tag с уровня server.
    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# dev.justea.ru — bootstrap-конфиг dev-стенда (до выпуска сертификата).
# Нужен, чтобы certbot смог пройти webroot-проверку по HTTP.
# Запрет индексации и basic auth действуют уже здесь.

server {
    listen 80;
    server_name dev.justea.ru;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    auth_basic "Justea dev stand";
    auth_basic_user_file /etc/nginx/.htpasswd-justea-dev;

    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }

    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

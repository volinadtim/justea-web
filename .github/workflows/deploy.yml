name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/ansible/requirements.txt

      - name: Validate deploy secrets
        shell: bash
        run: |
          test -n "${{ secrets.VPS_SSH_PRIVATE_KEY }}" || {
            echo "Missing GitHub secret VPS_SSH_PRIVATE_KEY"
            exit 1
          }

      - name: Setup SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 89.104.68.81 >> ~/.ssh/known_hosts

      - name: Install Ansible
        shell: bash
        run: |
          pip install -r infra/ansible/requirements.txt
          ansible-galaxy collection install community.docker ansible.posix

      - name: Run deploy playbook
        shell: bash
        run: |
          ansible-playbook \
            -i infra/ansible/inventory.ini \
            infra/ansible/deploy-fast.yml \
            --private-key ~/.ssh/deploy_key
